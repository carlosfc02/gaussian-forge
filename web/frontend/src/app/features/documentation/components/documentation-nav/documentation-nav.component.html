<label class="docs-nav-mobile"><span>Section</span><select [value]="activeSection" (change)="navigate.emit($any($event.target).value)">@for (section of sections; track section.id) {<option [value]="section.id">{{ section.title }}</option>}</select></label>
<nav class="docs-nav" aria-label="Documentation sections"><p>Basic usage</p>@for (section of basic(); track section.id) {<a [href]="'#' + section.id" [class.docs-nav__active]="activeSection === section.id" (click)="$event.preventDefault(); navigate.emit(section.id)">{{ section.title }}</a>}<p>Advanced settings</p>@for (section of advanced(); track section.id) {<a [href]="'#' + section.id" [class.docs-nav__active]="activeSection === section.id" (click)="$event.preventDefault(); navigate.emit(section.id)">{{ section.title }}</a>}</nav>
