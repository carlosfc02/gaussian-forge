<aside class="docs-callout" [class]="'docs-callout docs-callout--' + callout.tone"><i class="bi" [class.bi-info-circle]="callout.tone === 'info'" [class.bi-exclamation-triangle]="callout.tone === 'warning'" [class.bi-check-circle]="callout.tone === 'success'"></i><div><strong>{{ callout.title }}</strong><p>{{ callout.content }}</p></div></aside>
