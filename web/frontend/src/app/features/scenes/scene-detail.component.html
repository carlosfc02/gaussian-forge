<section class="scene-detail-page">
  <a class="scene-detail-back" routerLink="/dashboard"><i class="bi bi-arrow-left"></i> Back to dashboard</a>
  @if (facade.scene(); as scene) {
    <app-scene-detail-header [scene]="scene" [meta]="facade.sceneMeta()" />
    <section class="scene-detail-grid">
      <app-source-preview-card [scene]="scene" />
      <app-pipeline-status-card [meta]="facade.sceneMeta()" />
      <app-pipeline-run-card
        [run]="facade.pipelineRun()"
        [presets]="facade.pipelinePresets()"
        [selectedPreset]="facade.selectedPreset()"
        [canRun]="facade.canRunPipeline()"
        [isStarting]="facade.isStartingPipeline()"
        [isCanceling]="facade.isCancelingPipeline()"
        [actionError]="facade.pipelineActionError()"
        [actionMessage]="facade.pipelineActionMessage()"
        (selectedPresetChange)="facade.setSelectedPreset($event)"
        (runPipeline)="facade.startSimplePipeline()"
        (cancelPipeline)="facade.cancelPipeline()"
      />
      <app-advanced-pipeline-card
        [presets]="facade.pipelinePresets()"
        [selectedPreset]="facade.selectedPreset()"
        [controlsDisabled]="facade.pipelineIsRunning()"
        [canRun]="facade.canRunPipeline()"
        [isStarting]="facade.isStartingAdvancedPipeline()"
        (selectedPresetChange)="facade.setSelectedPreset($event)"
        (runPipeline)="facade.startAdvancedPipeline($event)"
      />
      <app-viewers-card
        [scene]="scene"
        [isLaunching3dgs]="facade.isLaunching3dgsViewer()"
        [isLaunchingSugar]="facade.isLaunchingSugarViewer()"
        [actionError]="facade.viewerActionError()"
        [actionMessage]="facade.viewerActionMessage()"
        (launch3dgs)="facade.launch3dgsViewer()"
        (launchSugar)="facade.launchSugarViewer()"
      />
      <app-generated-assets-card [scene]="scene" [assetCount]="facade.assetSummary()" />
      <app-metrics-card [metrics]="facade.sceneMetrics()" [stages]="facade.metricStages()" />
      <app-pipeline-logs-card [log]="facade.pipelineLog()" [selectedStage]="facade.selectedLogStage()" (selectedStageChange)="facade.setSelectedLogStage($event)" />
    </section>
  } @else if (facade.isLoading()) {
    <div class="scene-detail-loading"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Loading project progress...</div>
  } @else {
    <div class="scene-detail-error"><i class="bi bi-exclamation-octagon"></i><div><h2>Scene unavailable</h2><p>{{ facade.errorMessage() ?? 'The scene could not be loaded from the API.' }}</p></div></div>
  }
</section>
