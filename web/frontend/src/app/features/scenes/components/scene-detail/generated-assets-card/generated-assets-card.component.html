<div class="scene-detail-card__header"><h2>Generated assets</h2><span class="scene-detail-card__meta">{{ assetCount }}/4</span></div>
<ul class="scene-detail-assets">
  <li [class.scene-detail-assets__item--ready]="!!scene.videoPath"><span>Input video</span><strong>{{ scene.videoPath ? 'Ready' : 'Missing' }}</strong></li>
  <li [class.scene-detail-assets__item--ready]="!!scene.maskPaths"><span>Masks</span><strong>{{ scene.maskPaths ? 'Ready' : 'Pending' }}</strong></li>
  <li [class.scene-detail-assets__item--ready]="!!scene.gsPath"><span>3DGS dataset</span><strong>{{ scene.gsPath ? 'Ready' : 'Pending' }}</strong></li>
  <li [class.scene-detail-assets__item--ready]="!!scene.sugarOutputPath"><span>SuGaR output</span><strong>{{ scene.sugarOutputPath ? 'Ready' : 'Pending' }}</strong></li>
</ul>
