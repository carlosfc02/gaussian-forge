services:
  sam2-seg:
    build:
      context: .
      dockerfile: docker/sam2/Dockerfile
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    image: tfg/sam2-seg:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_ROOT: /data
      JOBS_ROOT: /jobs
      LOGS_ROOT: /logs
      SAM2_REPO_DIR: /opt/sam2
      SAM2_CHECKPOINT_DIR: /models/sam2
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./scripts:/app/scripts
      - ./data:/data
      - ./jobs:/jobs
      - ./logs:/logs
      - ./models:/models
    gpus: all
    stdin_open: true
    tty: true
    command: ["python", "/app/scripts/segment_video.py", "--help"]

  colmap:
    build:
      context: .
      dockerfile: docker/colmap/Dockerfile
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    image: tfg/colmap:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      QT_QPA_PLATFORM: offscreen
    volumes:
      - ./data:/data
      - ./logs:/logs
    gpus: all
    stdin_open: true
    tty: true
    command: ["colmap", "-h"]

  gaussian-splatting:
    build:
      context: .
      dockerfile: docker/gaussian-splatting/Dockerfile
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    image: tfg/gaussian-splatting:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /opt/gaussian-splatting
    environment:
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes:
      - ./data:/data
      - ./logs:/logs
    gpus: all
    stdin_open: true
    tty: true
    command: ["python", "train.py", "--help"]

  sugar:
    build:
      context: .
      dockerfile: docker/sugar/Dockerfile
      args:
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    image: tfg/sugar:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /opt/SuGaR
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_ROOT: /data
      LOGS_ROOT: /logs
      SUGAR_OUTPUT_ROOT: /data/sugar_output
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes:
      - ./data:/data
      - ./logs:/logs
    gpus: all
    stdin_open: true
    tty: true
    command: ["conda", "run", "--no-capture-output", "-n", "sugar", "python", "train_full_pipeline.py", "--help"]
